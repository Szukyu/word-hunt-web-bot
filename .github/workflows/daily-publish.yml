name: daily-publish

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional date YYYY-MM-DD (default: today UTC)'
        required: false
        type: string
      backfill:
        description: 'Backfill last N days (1-90)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ssnqvqpovljjarewxgta.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || 'sb_publishable_mRwhl7o_3lkM_YuwNmPoRQ_c-QFDGHA' }}
    steps:
      - name: Trigger daily-publish edge function
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_BACKFILL: ${{ inputs.backfill }}
        run: |
          set -euo pipefail
          URL="${SUPABASE_URL}/functions/v1/daily-publish"
          QS=""
          BODY="{}"
          if [ -n "${INPUT_BACKFILL:-}" ]; then
            QS="?backfill=${INPUT_BACKFILL}"
            BODY="{\"backfill\": ${INPUT_BACKFILL}}"
          elif [ -n "${INPUT_DATE:-}" ]; then
            QS="?date=${INPUT_DATE}"
            BODY="{\"date\": \"${INPUT_DATE}\"}"
          fi
          echo "POST $URL$QS"
          echo "body: $BODY"
          HTTP_CODE=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "${URL}${QS}") || true
          echo "HTTP $HTTP_CODE"
          cat /tmp/resp.json 2>/dev/null || true; echo ""
          if [ "${HTTP_CODE}" -ge 400 ]; then
            echo "::error::Edge function returned HTTP ${HTTP_CODE}"
            exit 1
          fi

      - name: Inspect daily_puzzles for today
        run: |
          python3 - <<'PYEOF'
          import datetime, json, os, urllib.parse, urllib.request, sys
          base = os.environ["SUPABASE_URL"].rstrip("/")
          key  = os.environ["SUPABASE_PUBLISHABLE_KEY"]
          today = datetime.datetime.utcnow().strftime("%Y-%m-%d")
          qs = urllib.parse.urlencode({
              "puzzle_date": f"eq.{today}",
              "select": "puzzle_date,board_type,board_letters",
              "order": "board_type.asc",
          })
          req = urllib.request.Request(
              f"{base}/rest/v1/daily_puzzles?{qs}",
              headers={"apikey": key, "Authorization": f"Bearer {key}"},
          )
          with urllib.request.urlopen(req) as r:
              rows = json.loads(r.read())
          print(f"{today}: {len(rows)} row(s)")
          for row in rows:
              print("  ", row)
          if len(rows) == 0:
              print("::error::No puzzle found for today")
              sys.exit(1)
          if len(rows) > 1:
              print(f"::warning::Expected 1 puzzle/day, found {len(rows)}.")
              print("::warning::Deploy the v2 edge function to fix this:")
              print("::warning::  supabase functions deploy daily-publish --no-verify-jwt")
          PYEOF
