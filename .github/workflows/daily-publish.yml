name: daily-publish

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional date YYYY-MM-DD to publish (default: today UTC)'
        required: false
        type: string
      backfill:
        description: 'Backfill last N days (1-90, e.g. 7)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ssnqvqpovljjarewxgta.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || 'sb_publishable_mRwhl7o_3lkM_YuwNmPoRQ_c-QFDGHA' }}
    steps:
      - name: Publish daily puzzle via edge function
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_BACKFILL: ${{ inputs.backfill }}
        run: |
          set -euo pipefail
          URL="${SUPABASE_URL}/functions/v1/daily-publish"
          QS=""
          BODY="{}"
          if [ -n "${INPUT_BACKFILL:-}" ]; then
            QS="?backfill=${INPUT_BACKFILL}"
            BODY="{\"backfill\": ${INPUT_BACKFILL}}"
          elif [ -n "${INPUT_DATE:-}" ]; then
            QS="?date=${INPUT_DATE}"
            BODY="{\"date\": \"${INPUT_DATE}\"}"
          fi
          echo "POST $URL$QS"
          echo "body: $BODY"
          HTTP_CODE=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "${URL}${QS}")
          echo "HTTP $HTTP_CODE"
          cat /tmp/resp.json; echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Edge function returned $HTTP_CODE"
            exit 1
          fi
          VERSION=$(python3 -c "import json;print(json.load(open('/tmp/resp.json')).get('version'))")
          echo "edge version: $VERSION"
          if [ "$VERSION" != "2" ]; then
            echo "::error::Stale edge function (version=$VERSION, expected 2). Deploy supabase/functions/daily-publish."
            exit 1
          fi

      - name: Assert exactly 1 puzzle for today (direct DB check)
        run: |
          python3 - <<'EOF'
          import datetime, json, os, sys, urllib.parse, urllib.request
          base = os.environ["SUPABASE_URL"].rstrip("/")
          key  = os.environ["SUPABASE_PUBLISHABLE_KEY"]
          today = datetime.datetime.utcnow().strftime("%Y-%m-%d")
          qs = urllib.parse.urlencode({
            "puzzle_date": f"eq.{today}",
            "select": "puzzle_date,board_type,board_letters",
          })
          req = urllib.request.Request(
            f"{base}/rest/v1/daily_puzzles?{qs}",
            headers={"apikey": key, "Authorization": f"Bearer {key}"},
          )
          with urllib.request.urlopen(req) as r:
            rows = json.loads(r.read())
          print(json.dumps(rows, indent=2))
          if len(rows) != 1:
            print(f"::error::Expected exactly 1 puzzle for {today}, got {len(rows)}")
            sys.exit(1)
          print(f"Invariant OK: exactly 1 daily puzzle for {today}")
          EOF

      - name: Warn about absurd future rows (e.g. 2099)
        run: |
          python3 - <<'EOF'
          import datetime, json, os, urllib.parse, urllib.request
          base = os.environ["SUPABASE_URL"].rstrip("/")
          key  = os.environ["SUPABASE_PUBLISHABLE_KEY"]
          cutoff = (datetime.datetime.utcnow() + datetime.timedelta(days=366)).strftime("%Y-%m-%d")
          qs = urllib.parse.urlencode({"puzzle_date": f"gt.{cutoff}", "select": "puzzle_date"})
          req = urllib.request.Request(
            f"{base}/rest/v1/daily_puzzles?{qs}",
            headers={"apikey": key, "Authorization": f"Bearer {key}"},
          )
          with urllib.request.urlopen(req) as r:
            rows = json.loads(r.read())
          if rows:
            print(f"::warning::Found {len(rows)} absurd future rows (e.g. 2099).")
            print(f"  Run: DELETE FROM daily_puzzles WHERE puzzle_date > '{cutoff}';")
          else:
            print("No absurd future rows.")
          EOF
